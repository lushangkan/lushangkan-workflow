name: ai-solo-workflow
version: 1
description: AI-assisted solo OpenSpec workflow - scope gate -> behavior gate -> solution gate -> execution gate -> acceptance gate

artifacts:
  - id: proposal
    generates: proposal.md
    description: 中文提案，冻结单一问题范围、垂直切片、GitHub 跟踪和流程触发。
    template: proposal.md
    instruction: |
      先完成提案前探索，再写 proposal.md。

      全局写作规则：所有文档默认使用简体中文；如果工具依赖固定英文标题、关键字、文件名或格式，必须保留这些机器可解析内容，并在下一行用 Markdown 注释说明中文含义。

      面向中文母语者编写，句子必须自然、清楚、直接，避免翻译腔；内容要照顾可能存在阅读障碍的用户，使用稳定的结构、明确的标题、适度空行和列表来提高可读性。

      每个段落只表达一个主要意思；可以在同一段中用 **重点结论**、**关键规则**、**必须动作** 这类粗体短语标出重点，但不要整段加粗，也不要让粗体变成噪音。

      提案前必须先做：
      - 详细复述你对用户意图的理解，包括真实目标、问题范围、变更等级、能力边界和可能触发的 GitHub/C4/领域建模/ADR。
      - 如果之前执行过 openspec-explore，优先吸收那段探索对话，不要重复询问已经回答过的问题。
      - 研究优先。能通过代码、文档、Issue、ADR、C4、已有 specs 或子代理研究解决的问题，不询问用户。
      - 当意图模糊、范围过大、边界不清或存在多个解决方向时，使用 grilling 技能。每次只问一个真正影响决策的问题，并给出推荐答案。
      - 检查需求是否为端到端垂直切片。横向切割或多个独立功能必须拦截，先拆分并说明关联和构建顺序。

      写入 proposal.md 前必须完成 Workspace Gate：
      - 询问用户是否使用当前工作区，或创建隔离子工作区；同时询问是否新建分支。
      - AI 必须基于本次 change 的范围生成一个推荐分支名，优先使用 `change/<kebab-scope>`；如果用户或项目已有命名约定，以既有约定为准。
      - 如果用户选择当前工作区，记录选择和分支策略后再写 proposal.md。
      - 如果用户选择隔离子工作区，必须使用 `using-git-worktrees` skill 创建；创建时使用推荐分支名，除非用户覆盖。
      - 子工作区创建后，如果当前 agent 工具包含“移动当前会话到其他 worktree”的能力，必须主动调用该工具并移动到新路径。
      - 如果没有可调用的会话移动工具，但用户使用 opencode，输出 `/move <worktree-path>` 指令和新 worktree 路径，然后立即结束当前消息，等待用户执行移动后再继续。
      - 如果用户使用其他 coding 框架且没有可调用的会话移动工具，要求用户手动在新 worktree 路径打开或移动当前会话，然后立即结束当前消息。

      proposal.md 必须只覆盖一个问题范围、一个功能或一个明确技术能力。不要把多个独立子系统放进同一份提案。

      变更等级只能是：微小维护、普通变更、架构变更。
      - 微小维护：文档错字、配置小修、无行为变化；GitHub Issue/PR 推荐，不强制。
      - 普通变更：新功能、小修复、行为调整；GitHub Issue 和 PR 必须关联。
      - 架构变更：技术栈、数据模型、外部依赖、安全、部署、核心流程或系统边界；GitHub Issue 和 PR 必须关联，并严格考虑 C4、领域建模和 ADR。

      需要创建、更新或同步 GitHub Issue/PR 时，必须调用 github-project-flow skill。不要在 proposal 指令中展开 GitHub 细节流程。

      Capabilities 是 proposal 与 specs 的契约。新增能力使用 kebab-case 名称；修改能力必须对应 openspec/specs/ 中已有能力。

      任何默认决策都必须写明：默认选择是什么、为什么这样选、用户可以如何覆盖它。
    requires: []

  - id: proposal-review
    generates: proposal-review.md
    description: 使用 oracle 审查 proposal 是否聚焦、垂直切片、等级正确、触发规则合理。
    template: proposal-review.md
    instruction: |
      遵守本 workflow 的全局写作规则：简体中文优先、工具依赖的英文机器格式保留并用中文注释解释、段落清晰、适度使用粗体突出关键判断。

      这份 artifact 必须基于 oracle 子代理审查结果生成。

      oracle 的输入应包括 proposal.md、相关 openspec-explore 对话摘要、已有 specs、ADR、C4、CONTEXT 文档、GitHub Issue 和当前变更等级判断。

      审查重点：
      - 是否只聚焦一个范围、一个功能。
      - 是否是垂直切片，而不是横向切割。
      - 是否错误合并多个独立子系统。
      - 是否遗漏或低估架构/高影响变更。
      - GitHub Issue/PR 规则是否匹配。
      - C4、领域建模、ADR 触发是否正确。
      - 非目标是否清晰。
      - 默认决策是否明确且合理。

      如果结论不是“通过”，必须先回到 proposal.md 修改或拆分，不得继续进入 specs。

      如果审查结果需要创建或更新 GitHub Issue，调用 github-project-flow skill。
    requires:
      - proposal

  - id: specs
    generates: specs/**/*.md
    description: 中文能力规格，使用 OpenSpec delta 标题和 Gherkin 场景描述外部可观察行为。
    template: spec.md
    instruction: |
      遵守本 workflow 的全局写作规则：简体中文优先、工具依赖的英文机器格式保留并用中文注释解释、段落清晰、适度使用粗体突出关键判断。

      specs 定义 WHAT，不定义 HOW。

      默认不要读源码。只有当需求明确引用现有行为且必须落地时，才派 explorer 子代理读取相关文件，并要求它只返回外部可观察行为：输入、输出、状态变化和副作用；不要返回实现、数据结构、算法或调用路径。

      写 spec 前必须完成 Three Amigos 式分析：
      - 业务视角：解决什么问题，成功对用户意味着什么。
      - 开发视角：约束、依赖、边界和实现风险是什么。
      - QA 视角：什么可能出错，哪些边界会让“看起来通过”的实现失败。

      先形成并让用户确认具体规则、场景标题和未决问题，再写 spec.md。不要让模型自己把模糊验收标准直接变成测试。

      每个 proposal Capabilities 中列出的能力都必须对应一个 spec 文件。新能力使用 proposal 中的 kebab-case 名称：specs/<capability>/spec.md。修改能力使用已有 spec folder 名称。

      OpenSpec delta 标题必须保留英文机器格式：
      - ## ADDED Requirements
      - ## MODIFIED Requirements
      - ## REMOVED Requirements
      - ## RENAMED Requirements

      保留英文标题后，下一行必须用 Markdown 注释写中文说明。

      Requirement 和 Scenario 标题保留机器关键字：
      - ### Requirement: 中文需求名称
      - #### Scenario: 中文场景名称

      每个功能/行为需求必须至少有一个 Gherkin 场景，使用大写关键字：GIVEN、WHEN、THEN、AND、BUT。

      场景必须描述真实用户表面或真实系统边界可观察的行为。不要只验证内部函数、数据库行、mock 状态或实现细节。

      MODIFIED Requirements 必须复制完整旧 requirement 后修改，不能只写差异片段。REMOVED Requirements 必须写 Reason 和 Migration。RENAMED Requirements 只用于改名，不用于改行为。

      写入前必须做 drift check：重新对照 proposal 和 proposal-review。如果分析结果漂移出 proposal 范围、目标或非目标，停止并回到 proposal 或拆分。
    requires:
      - proposal-review

  - id: design
    generates: design.md
    description: 中文技术设计，协作式选择方案、审批新库、触发 C4/domain/ADR，并记录取舍。
    template: design.md
    instruction: |
      遵守本 workflow 的全局写作规则：简体中文优先、工具依赖的英文机器格式保留并用中文注释解释、段落清晰、适度使用粗体突出关键判断。

      design.md 回答 HOW，但不能新增 proposal/specs 没覆盖的功能。

      写 design.md 前必须先扫描项目上下文：代码、文档、AGENTS.md、CLAUDE.md、GEMINI.md、CONTEXT.md、已有 ADR、已有 C4 文档、OpenSpec proposal、proposal-review 和 specs。

      正常模式下，不得直接跳到完整设计。必须先提出 2-3 个真实不同的设计方向，包含核心思路、优点、缺点、复杂度、关键假设、AI Coding 成本和推荐方案。不要为了凑数编弱方案。

      设计确认必须尊重人工干预预算：普通变更采用“候选方案 -> 用户选方向 -> 一次成稿 -> oracle review”；架构/高影响变更采用“候选方案 -> 核心决策确认 -> 分段补齐 C4/domain/ADR -> oracle review”。不要每个小段都打断用户，也不要在架构变更中一次性吞掉关键决策。

      新引入或替换库必须先审批。对解析、验证、HTTP、重试、调度、队列、认证、加密、日期、资金、可观测性等重要组件，先调研 2-3 个候选库。

      评估维度：维护性、稳定性、受欢迎程度、许可证、安全性、兼容性、现有依赖匹配度、AI Coding 成本。

      用户批准前，不得把新库或替换库写入最终设计。项目已经使用的库不需要重新审批。

      在提出自定义代码方案前，必须先调研生态系统。选择自定义时，必须说明为什么没有合适的库。

      所有新库或替换库的完整评估过程都必须记录在 design.md。只有核心库、长期依赖、替换成本高或影响架构边界的库才强制写 ADR。

      架构变更必须考虑 c4-architecture 技能，通常至少产出 Context + Container。涉及领域术语、业务概念或边界语言时，必须调用 domain-modeling 更新 CONTEXT.md。难以回退、有真实取舍、未来读者会疑惑的决策必须写 ADR。

      写完 design.md 后必须使用 oracle 审查：proposal/specs 对齐、范围漂移、YAGNI、新库审批、C4/domain/ADR 触发、技术栈选择是否解释充分。

      如果设计选择、C4、ADR、领域建模或新库审批影响 GitHub Issue/PR 内容，调用 github-project-flow skill 更新跟踪信息。
    requires:
      - specs

  - id: implementation-mode
    generates: implementation-mode.md
    description: 选择实施模式、AI 参与程度、风险耗时、人工审批点和停损点。
    template: implementation-mode.md
    instruction: |
      遵守本 workflow 的全局写作规则：简体中文优先、工具依赖的英文机器格式保留并用中文注释解释、段落清晰、适度使用粗体突出关键判断。

      tasks.md 之前必须先确定 implementation-mode。

      生成 implementation-mode.md 前，必须使用选择工具向用户询问实施模式。不能只在文档中写默认值后继续。

      选择工具必须至少包含以下选项，并把“AI 主导，人工辅助”放在第一项作为推荐选项：
      - AI 主导，人工辅助：推荐。适合多数边界清楚但仍需要人工确认关键节点的单人开发切片，能兼顾效率和控制风险。
      - 单 Agent 自动实现：适合低风险、文件范围集中、验证命令明确的任务。
      - 多子代理并行实现：仅适合任务边界清楚、文件写入范围不重叠、测试方式明确且并行收益明显的任务。
      - 人工主导，AI 辅助：适合用户希望自己控制主要代码修改，AI 只做局部支持的任务。
      - 纯人工实现：适合用户只需要规格、设计、review 或排错建议，不希望 AI 修改代码的任务。

      询问时必须给出推荐选择和理由，说明主要风险、预估 AI 实现时间、是否建议使用子代理，以及为什么不默认选择多子代理并行。

      用户选择后，必须先基于选择生成 implementation-mode.md 草案摘要，并再次使用选择工具询问用户是否确认落地。确认选项必须至少包含：
      - 确认落地：写入 implementation-mode.md 并继续 tasks.md。
      - 调整后再确认：用户补充修改意见，修改草案后再次确认。
      - 暂不落地：停止在 Execution Gate，不写入 implementation-mode.md。

      用户未明确选择实施模式前，不得写入 implementation-mode.md。用户未明确确认落地前，不得写入 implementation-mode.md，也不得继续生成 tasks.md 或 execution-plan.md。

      模式只能从以下选项中选择：
      - 纯人工实现：用户自己实现，AI 只提供规格、设计、review 和排错建议。
      - 人工主导，AI 辅助：用户主导代码修改，AI 负责局部生成、解释、review、测试建议和排错。
      - AI 主导，人工辅助：AI 按 tasks.md 实现主要代码，用户在关键节点审批、试用和反馈。
      - 单 Agent 自动实现：一个 AI Agent 顺序执行全部 tasks，遇到阻塞再询问用户。
      - 多子代理并行实现：主 Agent 拆分 work units，派多个子代理并行处理不同边界，再统一整合。

      默认推荐“AI 主导，人工辅助”。只有任务边界清楚、文件范围不重叠、测试方式明确时，才允许多子代理并行实现。

      不得把多子代理并行实现作为静默默认。即使它看起来适合，也必须向用户说明并行收益、冲突风险、额外协调成本和回退方式，并等待用户选择。

      必须给出风险与耗时估算：风险等级、AI 实现时间、主要风险、建议切片、停损点。

      无论选择哪种模式，都必须明确是否使用子代理、使用哪些子代理、哪些任务顺序执行、哪些任务可以并行、人工审批点、AI 执行权限和回退策略。

      选择单 Agent 自动或多子代理并行时，必须额外明确人工审批点、AI 执行权限、子代理策略、并行策略和回退策略。
    requires:
      - design

  - id: tasks
    generates: tasks.md
    description: 按垂直切片生成可执行、可验证、OpenSpec 可追踪的任务清单。
    template: tasks.md
    instruction: |
      遵守本 workflow 的全局写作规则：简体中文优先、工具依赖的英文机器格式保留并用中文注释解释、段落清晰、适度使用粗体突出关键判断。

      tasks.md 只把通过审查的 proposal、specs、design 和 implementation-mode 转成可执行 checklist。不能重新设计方案，不能新增范围。

      每个 ## N. 标题必须代表一个垂直切片，而不是技术层、阶段或工作类别。完成该组任务后，用户应该能用一句话验证某个端到端结果。

      禁止按“准备 / 后端 / 前端 / 测试 / 文档 / 收尾”分组。测试、文档、C4、ADR 同步必须放进对应垂直切片内。

      每个任务必须使用 `- [ ] N.M` 格式。任务必须可验证，足够小，能判断完成或未完成。可以内联引用文件路径，但不要写代码片段、精确 shell 命令、提交信息或详细输出。

      默认使用真实边界端到端 TDD。每个非微小切片应包含：Three Amigos 场景确认、先失败的端到端验证、最小实现、验证通过、必要的文档/C4/ADR 同步。

      不采用“模型自己写测试然后自己实现”的朴素 TDD。场景必须先经用户确认，测试必须通过真实用户表面或真实系统边界验证行为。

      如果 implementation-mode 是多子代理并行实现，tasks.md 仍保持垂直切片；具体 work unit、阻塞关系、写入范围和并行策略写入 execution-plan.md。

      写完 tasks.md 后必须使用 oracle 审查：垂直切片、测试结果、spec/design 覆盖、YAGNI、是否横向切割、TDD 是否合理。

      tasks 准备进入 apply 前，如普通变更或架构变更尚未有 GitHub Issue，调用 github-project-flow skill 创建或更新 Issue。
    requires:
      - implementation-mode

  - id: execution-plan
    generates: execution-plan.md
    description: 仅多 Agent 模式使用，定义 work units、依赖、阻塞、文件所有权、review 和 ledger。
    template: execution-plan.md
    instruction: |
      遵守本 workflow 的全局写作规则：简体中文优先、工具依赖的英文机器格式保留并用中文注释解释、段落清晰、适度使用粗体突出关键判断。

      只有 implementation-mode 选择“多子代理并行实现”时才创建本 artifact。其他模式可写明“不适用”。

      execution-plan.md 不是新的需求或设计。它只描述如何安全地执行 tasks.md。

      必须为每个 work unit 标注：所属垂直切片、推荐代理、写入范围、读取范围、文件所有权、Review Owner、Blocked By、Blocks、是否可并行、验收输出。

      只有没有依赖边、没有共享写入文件、没有公共接口竞争的 work units 才能并行。

      子代理只写自己的 report 文件，主 Agent 维护唯一 ledger。多 worktree 时必须指定 memory authority，并写明权威 worktree、权威 changeRoot 和主 Agent。

      每个 work unit 完成后必须先做 spec-compliance review，再做 code-quality review。Critical/Important 问题必须修复并 re-review。Minor 问题记录到 ledger。
    requires:
      - tasks

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    apply 阶段只执行已经通过审查的 artifacts，不得直接修改 proposal.md、spec.md、design.md 或 tasks.md 来迁就实现。

    如果实现发现上游 artifact 有问题，必须暂停并回到对应 gate：spec 错回 Behavior Gate，design 错回 Solution Gate，tasks 错回 Execution Gate。

    执行顺序：
    1. Pre-flight：确认 artifacts、worktree、changeRoot、执行模式、lint/format/test/build 命令。
    - 如果 implementation-mode.md 选择“多子代理并行实现”，execution-plan.md 是 apply 前置条件。缺失、未完成或标记“不适用”时，必须停止并回到 Execution Gate。
    2. 创建或更新 <changeRoot>/.memory/，记录 worktree 信息、memory authority、handoff、ledger。
    3. Slice Graph：从 tasks.md 构建垂直切片依赖图，标出共享写入、阻塞关系和可并行组。
    4. Per-slice TDD：每个 Gherkin 场景一轮 RED -> VERIFY-RED -> GREEN -> VERIFY-GREEN -> REFACTOR，不能批量写测试。
    5. Spec Compliance Review：先检查是否满足 proposal/spec/design/tasks，不检查代码风格。
    6. Code Quality Review：再检查 YAGNI、项目规则、可维护性、测试质量和实现纪律。
    7. Per-slice Gate：lint/format/test/build 通过后，才允许把 tasks.md 中该 slice 的任务标为 [x]。
    8. Whole-change Review：所有 slices 完成后，检查跨 slice 集成和整体一致性。
    9. Final Gate：运行相关最终验证。
    10. Black-box Acceptance：非微小变更必须派无上下文验收代理。验收代理禁止读取源码、proposal.md、design.md、tasks.md、测试实现或内部实现说明；只能获得用户原始任务、运行入口、必要凭据、测试数据、明确成功标准和禁止事项。网页项目使用 agent-browser 从真实用户入口完成任务。
    11. GitHub Tracking：需要创建或更新 Issue/PR、标签、PR body、验收结果或阻塞状态时，调用 github-project-flow skill。主 apply 指令不展开 GitHub 操作细节。

    同一个 slice 的 spec-compliance、code-quality 或 gate 修复最多尝试 3 轮。第 3 轮仍失败时必须停止并判断是否回退 artifacts、换更强模型或缩小 slice。

    非微小变更完成后，归档前必须执行 memory-promotion-check：从 <changeRoot>/.memory/ 提取已验证、未来可复用的项目经验，提升到 openspec/memory/、AGENTS.md、CONTEXT.md 或 ADR。
